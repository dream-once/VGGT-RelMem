[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vggt-relground"
version = "0.1.0"
description = "Multi-view open-vocabulary 3D relation grounding front end"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["relground*", "adapters*", "evaluation*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
